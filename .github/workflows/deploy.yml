name: 🚀 Deploy Production

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy to Cloudflare
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: 🔐 Verify Production Gate Configuration
        env:
          PRODUCTION_DEPLOYMENT_GATE: ${{ secrets.PRODUCTION_DEPLOYMENT_GATE }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          test -n "$PRODUCTION_DEPLOYMENT_GATE" || { echo "::error::Configure the PRODUCTION_DEPLOYMENT_GATE secret in the protected production environment."; exit 1; }
          test -n "$PRODUCTION_URL" || { echo "::error::Configure PRODUCTION_URL in the production environment."; exit 1; }

      - name: ✅ Verify Successful CI for This Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pull-request-checks.yml/runs?head_sha=${GITHUB_SHA}&status=completed" --jq --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')
          test "$RUNS" -gt 0 || { echo "::error::No successful PR Quality Checks run exists for $GITHUB_SHA. Run CI on this exact commit before deploying."; exit 1; }

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🏗️ Build Application
        run: bun run build

      - name: 🗃️ Apply Production Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run db:migrate:remote

      - name: 🚀 Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy

  e2e-tests:
    name: 🎭 Run E2E Tests (${{ matrix.browser }})
    needs: [deploy]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🎭 Run Browser Tests
        uses: ./.github/actions/run-playwright
        with:
          browser: ${{ matrix.browser }}
          base-url: ${{ vars.PRODUCTION_URL }}
          report-name: playwright-report-production-${{ matrix.browser }}

  lighthouse:
    name: 🔦 Run Lighthouse Check
    needs: [deploy]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🔦 Run Lighthouse Check
        uses: ./.github/actions/run-lighthouse
        with:
          base-url: ${{ vars.PRODUCTION_URL }}
          number-of-runs: "3"
          start-server-command: ""
