name: 🚀 Deploy Production

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy to Cloudflare
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      production-url: ${{ steps.verify-production-config.outputs.production-url }}

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: 🛡️ Verify Production Environment Protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ENVIRONMENT=$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")
          printf '%s' "$ENVIRONMENT" | jq -e '[.protection_rules[]? | select(.type == "required_reviewers")] | length > 0' >/dev/null || {
            echo "::error::The production environment must require at least one reviewer."; exit 1;
          }
          BRANCH_POLICIES=$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")
          printf '%s' "$BRANCH_POLICIES" | jq -e '.total_count == 1 and .branch_policies[0].name == "main"' >/dev/null || {
            echo "::error::Restrict the production environment to the main branch only."; exit 1;
          }

      - name: 🔐 Verify Production Gate Configuration
        id: verify-production-config
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          case "$PRODUCTION_URL" in
            https://*) ;;
            *) echo "::error::Set PRODUCTION_URL to an HTTPS production URL in the production environment."; exit 1 ;;
          esac
          printf 'production-url=%s\n' "$PRODUCTION_URL" >> "$GITHUB_OUTPUT"

      - name: ✅ Verify Successful CI for This Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUCCESSFUL_CI_RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pull-request-checks.yml/runs?head_sha=${GITHUB_SHA}&status=completed" | jq --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length')
          test "$SUCCESSFUL_CI_RUNS" -gt 0 || { echo "::error::No successful PR Quality Checks run exists for $GITHUB_SHA. Run CI on this exact commit before deploying."; exit 1; }

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🏗️ Build Application
        run: bun run build

      - name: 🗃️ Apply Production Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run db:migrate:remote

      - name: 🚀 Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy

  e2e-tests:
    name: 🎭 Run E2E Tests (${{ matrix.browser }})
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🎭 Run Browser Tests
        uses: ./.github/actions/run-playwright
        with:
          browser: ${{ matrix.browser }}
          base-url: ${{ needs.deploy.outputs.production-url }}
          report-name: playwright-report-production-${{ matrix.browser }}

  lighthouse:
    name: 🔦 Run Lighthouse Check
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: ⚡ Setup Bun Environment
        uses: ./.github/actions/setup-bun

      - name: 🔦 Run Lighthouse Check
        uses: ./.github/actions/run-lighthouse
        with:
          base-url: ${{ needs.deploy.outputs.production-url }}
          number-of-runs: "3"
          start-server-command: ""
