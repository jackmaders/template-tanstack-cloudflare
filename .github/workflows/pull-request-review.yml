name: 🤖 PR Agent Review

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read


concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    name: 🧠 Review Pull Request
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
      contents: read
      pull-requests: write

    steps:
      - name: 🛒 Checkout Source Code
        uses: actions/checkout@v5

      - name: Run PR Agent review
        uses: the-pr-agent/pr-agent@6981f4951f44ef80d85a0753ace47a5cfa328592
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONFIG.EXTRA_CONFIG_URL: "${{ github.workspace }}/.config/pr-agent.toml"
